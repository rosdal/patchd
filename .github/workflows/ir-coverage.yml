name: ir-coverage

# Lowers every reference repo to IR, nightly and on pull requests that touch
# the IR builder: fails when any repo's share of syntax nodes lowered to real
# instructions drops below 98%, or when any function's IR fails validation
# (--verify runs ir.Validate on every function). vscode needs about 15 GB, so
# it is left out unless IR_REPOS lists it (with a BENCH_RUNNER large enough).
on:
  schedule:
    - cron: "0 4 * * *"
  pull_request:
    paths:
      - engine/ir/**
      - engine/tsbridge/tree.go
      - engine/tsbridge/batch.go
      - .github/workflows/ir-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      IR_REPOS: ${{ vars.IR_REPOS || 'nodegoat juice-shop commerce nestjs-realworld pnpm create-t3-turbo express zod execa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache reference repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .patchd/targets
          key: targets-${{ runner.os }}-${{ hashFiles('eval/targets/reference-repos.yaml') }}
      - run: pnpm targets:fetch $IR_REPOS
      - run: pnpm build:go
      - name: Lower and verify
        run: |
          mkdir -p .patchd/ir-coverage
          status=0
          for id in $IR_REPOS; do
            echo "::group::$id"
            ./bin/patchd debug ir-coverage ".patchd/targets/$id" --verify --min 98 | tee ".patchd/ir-coverage/$id.txt" || status=1
            echo "::endgroup::"
          done
          exit $status
      - if: always()
        name: Summary
        run: |
          {
            echo "### IR coverage"
            echo
            for f in .patchd/ir-coverage/*.txt; do
              echo "**$(basename "$f" .txt)**"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ir-coverage
          path: .patchd/ir-coverage/*.txt
