name: oracle

# tsbridge's types against TypeScript 6 on 500 sampled positions per
# reference repo: nightly, and on every pull request that moves the
# typescript-go pin. Fails when a repo's real-match rate drops below 98%.
on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths: ["engine/tsbridge/TSGO_VERSION", "tools/tsoracle/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      ORACLE_REPOS: ${{ vars.ORACLE_REPOS || 'nodegoat juice-shop commerce nestjs-realworld pnpm create-t3-turbo express zod execa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache reference repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .patchd/targets
          key: targets-${{ runner.os }}-${{ hashFiles('eval/targets/reference-repos.yaml') }}
      - run: pnpm targets:fetch $ORACLE_REPOS
      - run: pnpm build:go
      - run: pnpm oracle $ORACLE_REPOS
      - if: always()
        run: cat .patchd/oracle/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-reports
          path: .patchd/oracle/*.md
