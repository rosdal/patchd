name: eval-targets

# Weekly: scan the vulnerable integration targets and every reference repo
# with every rule, score them against eval/targets/expected/*.yaml and
# eval/triage/v0.4.yaml, and post the summary on the run. Fails on a missed
# in-scope issue or an untriaged finding (a new false positive to triage).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # vscode needs a large runner (about 30 GB at peak); set EVAL_RUNNER to
    # one, or EVAL_REPOS to the repos the default runner can take.
    runs-on: ${{ vars.EVAL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      EVAL_REPOS: ${{ vars.EVAL_REPOS || 'dvna juice-shop nodegoat commerce nestjs-realworld pnpm create-t3-turbo express zod execa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Cache reference repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .patchd/targets
          key: targets-${{ runner.os }}-${{ hashFiles('eval/targets/reference-repos.yaml') }}
      - run: pnpm targets:fetch $EVAL_REPOS
      - name: Score
        run: go run ./eval/cmd/targets -repos "${EVAL_REPOS// /,}" -report eval-targets.md
      - name: Summary
        if: always()
        run: cat eval-targets.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-targets
          path: eval-targets.md
