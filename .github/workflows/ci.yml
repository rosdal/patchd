name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      PATCHD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          target: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        # rpm runs tests/rpm_cross_check.rs against rpm's own version comparison.
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Verify the systemd units
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo install -m 755 target/${{ matrix.target }}/release/patchd /usr/bin/patchd
          systemd-analyze verify packaging/systemd/patchd-apply.service packaging/systemd/patchd-apply.timer
      - name: Smoke test
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/patchd --version
          ./target/${{ matrix.target }}/release/patchd-agent --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patchd-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/patchd
            target/${{ matrix.target }}/release/patchd-agent
            target/${{ matrix.target }}/release/patchd.exe
            target/${{ matrix.target }}/release/patchd-agent.exe

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
      - run: cargo xtask schema
      - name: Check the schema is up to date
        run: |
          if [ -n "$(git status --porcelain protocol/ docs/config.md)" ]; then
            git status --porcelain protocol/ docs/config.md
            git diff protocol/ docs/config.md
            echo "::error::protocol/schemas or docs/config.md is out of date; run cargo xtask schema and commit the result"
            exit 1
          fi

  # Runs the release-mode musl binary against real apt and checks its count matches
  # apt's own. The image list is what v0.2 supports.
  scan-integration:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patchd-x86_64-unknown-linux-musl
          path: bin
      - run: chmod +x bin/patchd
      - run: apt-get update -q && apt-get install -y -q jq
      - name: Scan
        run: |
          set +e
          bin/patchd scan
          bin/patchd scan --json > report.json
          code=$?
          echo "exit code $code"
          case $code in 0|10|11) ;; *) exit 1 ;; esac
      - name: Compare with apt
        run: |
          ours=$(jq '[.providers[] | select(.id=="apt") | .updates[] | select(.from_version != null and (.held | not))] | length' report.json)
          theirs=$(apt-get -s -q dist-upgrade | grep -cE '^Inst [^ ]+ \[' || true)
          echo "patchd=$ours apt=$theirs"
          [ "$ours" -eq "$theirs" ]

  # Runs `patchd apply` for real, as root, against fake repositories of tiny packages with
  # one failure mode each (tests/e2e). The images are the ones v0.3 supports.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12",     suite: apt }
          - { image: "debian:13",     suite: apt }
          - { image: "ubuntu:24.04",  suite: apt }
          - { image: "fedora:latest", suite: dnf }
          - { image: "almalinux:10",  suite: dnf }
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patchd-x86_64-unknown-linux-musl
          path: bin
      - run: chmod +x bin/patchd
      - run: bash tests/e2e/${{ matrix.suite }}/setup-container.sh
      - run: PATCHD="$PWD/bin/patchd" bats tests/e2e/${{ matrix.suite }}

  # Builds the .deb and .rpm from the tested musl binary, as the release does.
  packages:
    needs: test
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          target: x86_64-unknown-linux-musl
          cache: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deb,cargo-generate-rpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patchd-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release
      - run: chmod +x target/$TARGET/release/patchd
      - run: cargo deb -p patchd-cli --target $TARGET --no-build
      - run: cargo generate-rpm -p crates/patchd-cli --target $TARGET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            target/x86_64-unknown-linux-musl/debian/*.deb
            target/x86_64-unknown-linux-musl/generate-rpm/*.rpm

  # Installs each package on every supported distribution and checks what landed where.
  install:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "fedora:latest", "almalinux:10"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: pkg
      - run: bash tests/install/check-package.sh pkg

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - run: pnpm --package=@redocly/cli@2.63.0 dlx redocly lint protocol/openapi.yaml
