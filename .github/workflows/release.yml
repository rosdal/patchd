name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PATCHD_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rustflags: ""
          target: ${{ matrix.target }}
          cache: false
      - name: Check tag matches workspace version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "patchd-cli") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="patchd-${GITHUB_REF_NAME}-${TARGET}"
          bin="target/${TARGET}/release"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir "$name"
          cp "$bin/patchd$ext" "$bin/patchd-agent$ext" LICENSE-APACHE README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build .deb and .rpm from the same binary
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo deb -p patchd-cli --target "$TARGET" --no-build
          cargo generate-rpm -p crates/patchd-cli --target "$TARGET"
          cp target/"$TARGET"/debian/*.deb target/"$TARGET"/generate-rpm/*.rpm .
      - if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            patchd-*.tar.gz
            patchd_*.deb
            patchd-*.rpm
      - if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: patchd-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            patchd-*.tar.gz
            patchd-*.zip
            patchd_*.deb
            patchd-*.rpm

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
