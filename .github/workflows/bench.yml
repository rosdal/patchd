name: bench

# Engine speed and memory on the reference repos (tsbridge load and check, IR
# lowering), on every change to the engine. Pull requests compare against the
# latest main run and fail on a regression (> 15% load + check or lowering
# time, or > 20% peak memory, on any repo)
# unless the PR carries the perf-accepted label with a reason. Advisory: not a
# required check, so a noisy runner can't block merges; the comment shows the
# numbers either way.
on:
  pull_request:
    paths:
      [
        "engine/**",
        "tools/scripts/bench*.mjs",
        "eval/targets/reference-repos.yaml",
        "go.mod",
        "go.sum",
      ]
  push:
    branches: [main]
    paths: ["engine/**", "eval/targets/reference-repos.yaml", "go.mod", "go.sum"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    # One fixed runner size for every run, or the numbers aren't comparable.
    # vscode needs about 10 GB; set the BENCH_RUNNER variable to a larger
    # runner label to include it (BENCH_REPOS lists the repos otherwise).
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # download main's results
      pull-requests: write # comment the table
    env:
      BENCH_REPOS: ${{ vars.BENCH_REPOS || 'nodegoat juice-shop commerce nestjs-realworld pnpm create-t3-turbo express zod execa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Cache reference repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .patchd/targets
          key: targets-${{ runner.os }}-${{ hashFiles('eval/targets/reference-repos.yaml') }}
      - run: pnpm targets:fetch $BENCH_REPOS
      - run: pnpm bench --count 3 $BENCH_REPOS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          path: |
            bench-results.json
            bench-results.txt
          retention-days: 90 # main results are the trend history
      - name: Download main's latest results
        if: github.event_name == 'pull_request'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow bench.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run download "$run" --name bench-main --dir base
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Compare with main
        if: github.event_name == 'pull_request' && steps.base.outputs.found == 'true'
        env:
          PERF_ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') && '1' || '' }}
        run: |
          go tool -modfile=tools/go.mod benchstat base/bench-results.txt bench-results.txt > benchstat.txt || true
          node tools/scripts/bench-compare.mjs base/bench-results.json bench-results.json --out bench-table.md
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request' && steps.base.outputs.found == 'true'
        continue-on-error: true # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Engine benchmarks"
            echo
            cat bench-table.md
            echo
            echo "<details><summary>benchstat</summary>"
            echo
            echo '```'
            cat benchstat.txt
            echo '```'
            echo "</details>"
          } > comment.md
          gh pr comment "$PR" --edit-last --body-file comment.md || gh pr comment "$PR" --body-file comment.md
