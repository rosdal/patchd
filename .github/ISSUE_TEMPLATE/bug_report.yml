name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `patchd --version`
      placeholder: patchd 0.1.0 (a1b2c3d4e5 x86_64-unknown-linux-musl)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11 23H2 …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
