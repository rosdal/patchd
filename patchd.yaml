# yaml-language-server: $schema=./schema/patchd.schema.json
# Patchd reviewing itself.
version: 1

# Engine test data is vulnerable on purpose: patchd scan . skips it.
typescript:
  ignore:
    [
      "engine/testdata/**",
      "engine/ir/testdata/**",
      "engine/tsbridge/testdata/**",
      "eval/goldsets/**",
    ]

review:
  paths:
    include: ["web/src/**", "ide/vscode/src/**"]
    exclude: ["web/src/api/**", "**/*.gen.ts"]
  max_comments: 10

rules:
  security: on
  correctness: on

patches:
  delivery: suggest # suggest | commit | fixpr
