[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/rosdal/patchd"
publish = false

[workspace.dependencies]
patchd-core = { path = "crates/patchd-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "signal", "sync"] }
async-trait = "0.1"
schemars = { version = "1", features = ["derive", "uuid1"] }
jiff = { version = "0.2", features = ["serde"] }
gethostname = "1"
regex = "1"
comfy-table = "8"
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.58", default-features = false }
globset = "0.4"
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"     # Windows COM will need explicit #[allow] later

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
