pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: gofumpt -l -w {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml,css}"
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm oxlint {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
