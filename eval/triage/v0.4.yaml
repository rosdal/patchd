# v0.4 triage: every finding on the reference repos and every finding on the
# vulnerable targets that their expected list doesn't name. Lines are the sink
# call at the pinned commit. pnpm eval:targets fails on any finding missing
# here. Causes and decisions are summarised in docs/engine/rules/*.md.
#
# verdict: true-positive | false-positive | unclear
# decision: fixed (the finding is gone; a negative fixture keeps it gone),
#           defer <version>, or accept (documented as a known limitation)
version: v0.4
entries:
